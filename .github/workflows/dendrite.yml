name: Dendrite

on:
  push:
    branches:
      - main
    paths:
      - "**.go" # only execute on changes to go files
      - "go.sum" # or dependency updates
      - ".github/workflows/**" # or workflow changes
  pull_request:
    paths:
      - "**.go"
      - "go.sum" # or dependency updates
      - ".github/workflows/**"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run golangci-lint
  lint:
    timeout-minutes: 5
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: apt-get update && apt-get install -y libolm-dev libolm3 build-essential
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        env:
          CGO_ENABLED: 1

  # run go test with different go versions
  test:
    timeout-minutes: 10
    name: Unit tests
    runs-on: ubuntu-latest
    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres:13-alpine
        # Provide the password for postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dendrite
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: apt-get update && apt-get install -y libolm-dev libolm3 build-essential
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go test -v ./...
        env:
          POSTGRES_HOST: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dendrite

  # Dummy step to gate other tests on without repeating the whole list
  initial-tests-done:
    name: Initial tests passed
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }} # Run this even if prior jobs were skipped
    steps:
      - name: Check initial tests passed
        run: |
          echo "Checking job results..."
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "Some jobs failed or were cancelled"
            exit 1
          fi
          echo "All initial tests passed!"

  # run go test with different go versions
  integration:
    timeout-minutes: 20
    needs: initial-tests-done
    name: Integration tests
    runs-on: ubuntu-latest
    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres:13-alpine
        # Provide the password for postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dendrite
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: apt-get update && apt-get install -y libolm-dev libolm3 build-essential
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go test -race -v $(go list ./... | grep -v /cmd/dendrite*)
        env:
          POSTGRES_HOST: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dendrite

  integration-tests-done:
    name: Integration tests passed
    needs:
      [
        initial-tests-done,
        integration,
      ]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }} # Run this even if prior jobs were skipped
    steps:
      - name: Check integration tests passed
        run: |
          echo "Checking job results..."
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "Some jobs failed or were cancelled"
            exit 1
          fi
          echo "All integration tests passed!"

  # Build release binaries using xgo for cross-compilation
  release-build:
    name: "Build release binaries"
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [integration-tests-done]
    steps:
      - uses: actions/checkout@v6
      - name: Build with xgo
        uses: https://github.com/crazy-max/ghaction-xgo@v3
        with:
          xgo_version: latest
          go_version: file:go.mod
          dest: dist
          prefix: dendrite
          targets: linux/amd64,linux/arm64,linux/arm-7,darwin/amd64,darwin/arm64,windows/amd64
          pkg: ./cmd/dendrite
          ldflags: -s -w
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dendrite-${{ github.ref_name }}-binaries
          path: dist/*

  update-docker-images:
    name: Update Docker images
    permissions:
      packages: write
      contents: read
      security-events: write # To upload Trivy sarif files
    if: github.repository == 'element-hq/dendrite' && github.ref_name == 'main'
    needs: [integration-tests-done]
    uses: element-hq/dendrite/.github/workflows/docker.yml@main
    secrets:
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
