name: MSC4521 Complement

# Runs the MSC4521 set-reconciliation suite against a Rezzy-enabled Zendrite
# image. This is separate from the main Complement job because it needs the
# native library, a named Rezzy build context, and a Complement branch that
# carries tests/msc4521. It is not part of the release gate yet.
#
# Zendrite currently implements the responder side (room_digest, room_diff) and
# an explicit admin trigger, but not periodic outbound reconciliation. The
# default run therefore covers the tests that only exercise the responder and
# the ordinary federation fallback. Tests that require the homeserver to
# initiate an exchange are opt-in via run_outbound until outbound scheduling
# lands.

on:
  workflow_dispatch:
    inputs:
      complement_ref:
        description: "Complement branch containing tests/msc4521"
        required: false
        default: "guru/feat/msc4521-libminisketch-set-recon"
      run_outbound:
        description: "Run tests that require Zendrite to initiate reconciliation (fails until outbound scheduling exists)"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - "feat/rezzy"
    paths:
      - "**.go"
      - "go.rezzy.mod"
      - "go.rezzy.sum"
      - "rezzy"
      - "build/scripts/ComplementRezzy.Dockerfile"
      - ".github/workflows/msc4521-complement.yml"

permissions:
  contents: read

jobs:
  complement-msc4521:
    name: "Complement (MSC4521, rezzy)"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout dendrite
        uses: actions/checkout@v5
        with:
          path: dendrite

      - name: Checkout Rezzy submodule
        run: git -C dendrite submodule update --init --depth 1 rezzy

      - name: Checkout hooked gomatrixserverlib fork
        # The build context is resolved from the dendrite working directory, so
        # this must be a sibling of dendrite, not of the workspace.
        #
        # Fetch the branch rather than the bare commit: GitHub does not serve
        # arbitrary commit SHAs as refs. The pin may sit behind the branch tip,
        # so fetch enough history to reach it; a depth of 1 only has the tip.
        # The checkout then verifies the pin, so a moved branch fails here
        # instead of silently building something else.
        env:
          GMSL_REPO: https://github.com/gamesguru/gomatrixserverlib.git
          GMSL_BRANCH: feat/rezzy
          GMSL_COMMIT: 238ff2c0584fbfc2c9712e57955ae259b0f40727
        run: |
          set -euo pipefail
          git init gmsl
          git -C gmsl remote add origin "$GMSL_REPO"
          git -C gmsl fetch --depth=100 origin "$GMSL_BRANCH"
          git -C gmsl checkout "$GMSL_COMMIT"
          test "$(git -C gmsl rev-parse HEAD)" = "$GMSL_COMMIT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rezzy-enabled Complement image
        working-directory: dendrite
        run: |
          set -euo pipefail
          docker buildx build --load \
            --build-context rezzy=./rezzy \
            --build-context gmsl=../gmsl \
            -f build/scripts/ComplementRezzy.Dockerfile \
            -t complement-dendrite:rezzy .

      - name: Checkout Complement MSC4521 suite
        env:
          COMPLEMENT_REF: ${{ inputs.complement_ref || 'guru/feat/msc4521-libminisketch-set-recon' }}
        run: |
          set -euo pipefail
          mkdir -p complement
          wget -O - "https://github.com/gamesguru/complement/archive/refs/heads/${COMPLEMENT_REF}.tar.gz" \
            | tar -xz --strip-components=1 -C complement
          test -d complement/tests/msc4521

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: complement/go.mod
          cache-dependency-path: complement/go.sum

      - name: Run inbound MSC4521 tests
        working-directory: complement
        env:
          COMPLEMENT_BASE_IMAGE: complement-dendrite:rezzy
          COMPLEMENT_SHARE_ENV_PREFIX: COMPLEMENT_DENDRITE_
        run: |
          set -o pipefail
          # Responder-side protocol and the same-homeserver scenarios, plus the
          # adversarial checks that only assert we do not contact strangers.
          go test -tags zendrite_blacklist -v -timeout 45m \
            -run 'TestMSC4521/(Primitives|Compatibility)' ./tests/msc4521/...
          go test -tags zendrite_blacklist -v -timeout 15m \
            -run 'TestMSC4521/(Convergence|Adversarial)/(ActiveRoom|NonMembersAndACLBlocked)' \
            ./tests/msc4521/...

      - name: Run outbound reconciliation tests
        if: ${{ inputs.run_outbound }}
        working-directory: complement
        env:
          COMPLEMENT_BASE_IMAGE: complement-dendrite:rezzy
          COMPLEMENT_SHARE_ENV_PREFIX: COMPLEMENT_DENDRITE_
        run: go test -tags zendrite_blacklist -v -timeout 60m ./tests/msc4521/...
