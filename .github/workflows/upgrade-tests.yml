name: Upgrade Tests

on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.sum"
      - ".github/workflows/upgrade-tests.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.sum"
      - ".github/workflows/upgrade-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade_test:
    name: "Upgrade tests (${{ matrix.label }})"
    timeout-minutes: 20
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: all versions
            flags: ""
          - label: direct from HEAD-2
            flags: "-direct -from HEAD-2"
    steps:
      - name: Install Node.js
        run: apk add --no-cache nodejs
      - uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Docker version
        run: docker version
      - name: Build upgrade-tests
        run: go build ./cmd/dendrite-upgrade-tests
      - name: Test upgrade (PostgreSQL)
        run: ./dendrite-upgrade-tests ${{ matrix.flags }} -repository=matrix-org/dendrite --head .
      - name: Test upgrade (SQLite)
        run: ./dendrite-upgrade-tests ${{ matrix.flags }} --sqlite -repository=matrix-org/dendrite --head .
