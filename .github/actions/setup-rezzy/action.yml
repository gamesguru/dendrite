---
name: Set up Rezzy
description: Build Rezzy's native library and configure pkg-config. The gomatrixserverlib fork is a normal module requirement in go.mod, so it needs no sibling checkout.
inputs:
  native:
    description: Build the Linux native library and configure pkg-config.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      if: inputs.native == 'true'
    - name: Build Rezzy native library
      if: inputs.native == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config
        make -C rezzy/rezzy-ffi native
        echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/rezzy/target/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
