name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.forgejo/workflows/website.yaml'
  pull_request:
    paths:
      - 'website/**'
      - '.forgejo/workflows/website.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install unzip
        run: apt-get update && apt-get install -y unzip

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: website
        run: bun run build

      - name: Upload artifact
        uses: forgejo/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist

  links:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: forgejo/download-artifact@v4
        with:
          name: website-dist
          path: dist

      - name: Check links
        uses: https://github.com/lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --root-dir ${{ github.workspace }}/dist
            --exclude-path ${{ github.workspace }}/dist/pagefind
            --no-progress
            '${{ github.workspace }}/dist/**/*.html'
          fail: true

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build, links]
    steps:
      - name: Download artifact
        uses: forgejo/download-artifact@v4
        with:
          name: website-dist
          path: dist

      - name: Deploy to pages branch
        run: |
          cd dist
          apt-get update && apt-get install -y git
          git init -b pages
          git config user.name "pat-s"
          git config user.email "pat-s@mailbox.org"
          git add .
          git commit -m "Deploy website from ${GITHUB_SHA::8}"
          git remote add origin "${GITHUB_SERVER_URL/\/\//\/\/forgejo-action:${GITHUB_TOKEN}@}/${GITHUB_REPOSITORY}.git"
          git push --force origin pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
