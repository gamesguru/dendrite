name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6am UTC
  workflow_dispatch:

jobs:
  scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    container:
      image: cr.codefloe.com/docker.io/aquasec/trivy:0.74.0
    steps:
      - name: Install dependencies
        run: apk add --no-cache nodejs jq curl

      - uses: actions/checkout@v7

      - name: Run Trivy scan
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'
        run: trivy fs --format json --skip-dirs vendor,node_modules . > scan.json

      - name: Update or create vulnerability dashboard issue
        env:
          ISSUE_TOKEN: ${{ secrets.ISSUE_TOKEN }}
          API_URL: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        shell: sh
        run: |
          TITLE="Vulnerability dashboard"
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          {
            echo "## Security Scan Results"
            echo ""
            echo "**Last updated:** ${DATE}"
            echo ""

            # Check if there are any vulnerabilities
            VULN_COUNT=$(jq '[.Results[]? | .Vulnerabilities[]?] | length' scan.json)

            if [ "$VULN_COUNT" = "0" ] || [ -z "$VULN_COUNT" ]; then
              echo "✅ **No vulnerabilities found**"
            else
              echo "| Severity | Package | Version | Fixed Version | CVE | Title |"
              echo "|----------|---------|---------|---------------|-----|-------|"
              jq -r '.Results[]? | .Target as $target | .Vulnerabilities[]? | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "-") | \(.VulnerabilityID) | \(.Title // "-" | gsub("\n"; " ") | .[0:50]) |"' scan.json | sort -t'|' -k2,2
            fi

            echo ""
            echo "---"
            echo "*Automatically generated by Security Scan workflow*"
          } > body.md

          ISSUE_NUMBER=$(curl -s "${API_URL}/issues?state=open&type=issues&token=$ISSUE_TOKEN" \
            | jq -r --arg title "$TITLE" '.[] | select(.title == $title) | .number' | head -1)

          JSON_DATA=$(jq -n --arg title "$TITLE" --rawfile body body.md '{title:$title, body:$body}')

          if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "null" ]; then
            echo "Updating existing issue #$ISSUE_NUMBER"
            curl -s -X PATCH "${API_URL}/issues/${ISSUE_NUMBER}?token=$ISSUE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$JSON_DATA"
          else
            echo "Creating new issue"
            curl -s -X POST "${API_URL}/issues?token=$ISSUE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$JSON_DATA"
          fi
