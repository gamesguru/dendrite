name: Zendrite

on:
  push:
    branches:
      - main
    paths:
      - '**.go' # only execute on changes to go files
      - 'go.mod' # or dependency updates
      - 'go.sum' # or dependency updates
      - '.pre-commit-config.yaml'
      - '.forgejo/workflows/**' # or workflow changes
      - 'Dockerfile'
      - 'website/bun.lock'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod' # or dependency updates
      - 'go.sum' # or dependency updates
      - '.pre-commit-config.yaml'
      - '.forgejo/workflows/**'
      - 'Dockerfile'
      - 'website/bun.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run golangci-lint
  lint:
    timeout-minutes: 5
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: apt-get update && apt-get install -y libolm-dev libolm3 build-essential
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        env:
          CGO_ENABLED: 1

  # Run tests split by package groups for parallelism
  test:
    timeout-minutes: 15
    name: Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: syncapi
            packages: ./syncapi/...
          - group: clientapi
            packages: ./clientapi/...
          - group: roomserver
            packages: ./roomserver/...
          - group: userapi
            packages: ./userapi/...
          - group: federationapi
            packages: ./federationapi/...
          - group: other
            packages: ./appservice/... ./mediaapi/... ./relayapi/... ./internal/... ./setup/... ./test/...
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dendrite
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: apt-get update && apt-get install -y libolm-dev libolm3 build-essential
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Run tests
        run: go test -race -v ${{ matrix.packages }}
        env:
          POSTGRES_HOST: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dendrite

  tests-done:
    name: Tests passed
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Check tests passed
        run: |
          echo "Checking job results..."
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "Some jobs failed or were cancelled"
            exit 1
          fi
          echo "All tests passed!"
