# Config file for golangci-lint v2
version: "2"

run:
  concurrency: 4
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nakedret
    - staticcheck
    - unparam
    - unused
  exclusions:
    paths:
      - bin
      - docs
    rules:
      # Exclude some linters from running on test files
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
      # Exclude some staticcheck messages
      - linters:
          - staticcheck
        text: "SA9003:"
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable:
        - shadow
    gocyclo:
      min-complexity: 25
    misspell:
      locale: UK
    nakedret:
      max-func-lines: 60

formatters:
  enable:
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
